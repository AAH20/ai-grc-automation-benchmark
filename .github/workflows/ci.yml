name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: grcbench qualify catalog/evidence-valid.json --as-of 2026-09-07T12:00:00Z --output outputs/evidence-qualified.json
      - run: grcbench score catalog/reference-scorecard.json --output outputs/scorecard.json
      - run: grcbench economics catalog/economics.json --output outputs/economics.json
      - run: grcbench import-frameworks catalog/ciso-assistant-sample.json --output outputs/frameworks.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
