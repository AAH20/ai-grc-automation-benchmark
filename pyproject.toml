[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-grc-automation-benchmark"
version = "0.1.0"
description = "Reproducible benchmark for agentic GRC evidence reliability, mapping, resilience, safety, and unit economics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Ahmed Hassan" }]
keywords = ["GRC automation", "agentic AI", "cyber risk quantification", "compliance automation", "evidence automation"]

[project.scripts]
grcbench = "grcbench.cli:main"

[tool.setuptools.packages.find]
include = ["grcbench*"]
